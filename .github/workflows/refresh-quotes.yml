name: Refresh quotes

on:
  # Every 5 minutes during NSE hours (03:00-10:45 UTC = 08:30-16:15 IST).
  # GitHub's scheduler is best-effort: it drops and delays runs, especially on
  # new repositories and at busy times. Frequent attempts are the only defence
  # available inside GitHub. Actions minutes are free on public repositories.
  schedule:
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-quotes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live quotes
        run: python quotes.py

      - name: Commit the refreshed data
        run: |
          git config user.name "quote-bot"
          git config user.email "actions@github.com"
          git add data
          git commit -m "quotes: $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing changed"
          git push
